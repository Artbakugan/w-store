openapi: 3.0.3
info:
  title: W Store API
  description: REST API для керування спортивними товарами каталогу W Store
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Локальний сервер розробки

paths:
  /health:
    get:
      summary: Перевірка стану сервера
      responses:
        '200':
          description: Сервер працює
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /items:
    get:
      summary: Отримати список усіх товарів
      responses:
        '200':
          description: Список товарів
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItemResponse'
    post:
      summary: Додати новий товар у каталог
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateItemRequest'
      responses:
        '201':
          description: Товар успішно створено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponse'
        '400':
          description: Помилка валідації
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /items/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: ID товару
    get:
      summary: Отримати деталі одного товару за ID
      responses:
        '200':
          description: Деталі товару
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponse'
        '404':
          description: Товар не знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Оновити інформацію про товар
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateItemRequest'
      responses:
        '200':
          description: Товар оновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponse'
        '400':
          description: Помилка валідації
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Товар не знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Видалити товар за ID
      responses:
        '204':
          description: Товар видалено
        '404':
          description: Товар не знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    CreateItemRequest:
      type: object
      required:
        - name
        - price
      properties:
        name:
          type: string
          example: Кросівки W-Run Ultra
        price:
          type: number
          example: 3200
        stockQuantity:
          type: integer
          default: 0
          example: 12

    UpdateItemRequest:
      type: object
      required:
        - name
        - price
      properties:
        name:
          type: string
          example: Кросівки W-Run Ultra 2.0
        price:
          type: number
          example: 3450
        stockQuantity:
          type: integer
          example: 8

    ItemResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Кросівки W-Run Pro
        price:
          type: number
          example: 2800
        stockQuantity:
          type: integer
          example: 15

    ErrorResponse:
      type: object
      required:
        - error
        - code
      properties:
        error:
          type: string
          example: ValidationError
        code:
          type: string
          example: INVALID_INPUT
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: name
              message:
                type: string
                example: Назва товару є обов'язковою