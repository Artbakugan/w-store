name: W Store CI/CD

on:
  push:
    branches: [main]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  backend:
    name: Backend tests (SQLite and PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: w_store_ci
          POSTGRES_USER: w_store_ci
          # The service lives on the disposable GitHub-hosted runner.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U w_store_ci -d w_store_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Run all tests with PostgreSQL integration enabled
        working-directory: backend
        env:
          W_STORE_TEST_POSTGRES: '1'
          PGHOST: 127.0.0.1
          PGPORT: ${{ job.services.postgres.ports['5432'] }}
          PGDATABASE: w_store_ci
          PGUSER: w_store_ci
        run: npm test

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check JavaScript syntax
        run: node --check frontend/resilience.js
      - name: Test catalog and request resilience
        run: node --test backend/tests/catalog.test.js backend/tests/resilience.test.js

  docker:
    name: Build API and frontend images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      commit: ${{ steps.build.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build images
        id: build
        run: |
          commit=$(git rev-parse HEAD)
          labels=(
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
            --label "org.opencontainers.image.revision=$commit"
          )
          docker build "${labels[@]}" -f backend/Dockerfile -t w-store-api:ci .
          docker build "${labels[@]}" -t w-store-frontend:ci frontend
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Check nginx configuration
        run: docker run --rm w-store-frontend:ci nginx -t
      - name: Export images for publication
        if: github.event_name == 'push'
        run: docker image save w-store-api:ci w-store-frontend:ci | gzip -1 > "$RUNNER_TEMP/w-store-images.tar.gz"
      - name: Upload image archive
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: w-store-images
          path: ${{ runner.temp }}/w-store-images.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  publish:
    name: Publish images to GHCR
    needs: [backend, frontend, docker]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write
    steps:
      - name: Download image archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: w-store-images
          path: ${{ runner.temp }}
      - name: Load images built by CI
        run: docker image load --input "$RUNNER_TEMP/w-store-images.tar.gz"
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Tag and push both images
        env:
          COMMIT_SHA: ${{ needs.docker.outputs.commit }}
        run: |
          tags=("sha-$COMMIT_SHA")
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tags+=("$GITHUB_REF_NAME")
          fi

          echo '### Images published to GHCR' >> "$GITHUB_STEP_SUMMARY"
          for component in api frontend; do
            package="ghcr.io/${GITHUB_REPOSITORY,,}-$component"
            for tag in "${tags[@]}"; do
              image="$package:$tag"
              docker image tag "w-store-$component:ci" "$image"
              docker image push "$image"
              printf '\n- `%s`\n' "$image" >> "$GITHUB_STEP_SUMMARY"
            done
          done

  summary:
    name: Job Summary
    needs: [backend, frontend, docker, publish]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Summarize workflow results
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          {
            echo '## W Store CI/CD'
            echo
            echo '| Check | Result |'
            echo '| --- | --- |'
            printf '| Backend (SQLite and PostgreSQL) | %s |\n' "$BACKEND_RESULT"
            printf '| Frontend | %s |\n' "$FRONTEND_RESULT"
            printf '| Docker builds and nginx configuration | %s |\n' "$DOCKER_RESULT"
            printf '| GHCR publication | %s |\n' "$PUBLISH_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
